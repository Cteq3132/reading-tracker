# Compile l'app pour le simulateur, sans signature, sur chaque PR et chaque push sur main.
# Image et version d'Xcode : voir docs/CI.md (la version est dans .github/actions/setup-ios).
name: ios-build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build (simulateur)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Les secrets sont vides sur une PR venant d'un fork : des valeurs factices les
      # remplacent, suffisantes pour compiler.
      - uses: ./.github/actions/setup-ios
        with:
          supabase-host: ${{ secrets.SUPABASE_HOST }}
          supabase-publishable-key: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          allow-placeholder-secrets: "true"

      - name: Compiler pour le simulateur
        run: |
          xcodebuild build \
            -project ios/ReadingTracker.xcodeproj \
            -scheme ReadingTracker \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGNING_ALLOWED=NO
